name: Draft release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify release version
        run: |
          VERSION=$(python3 scripts/version.py)
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match project version $VERSION."
            exit 1
          fi
          xcodebuild -version

      - name: Run regression tests
        run: |
          python3 scripts/tests/ReleaseWorkflowTests.py
          sh ios/Tests/run-reader-state-tests.sh
          sh ios/Tests/run-search-index-tests.sh
          sh ios/Tests/run-image-downsampler-tests.sh

      - name: Build unsigned IPA
        run: sh ios/build.sh

      - name: Save IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuitComic-ipa-${{ github.ref_name }}
          path: build/exported/nuitcomic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Save iOS debug symbols
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuitComic-ios-symbols-${{ github.ref_name }}
          path: ios/build/nuitcomic.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify release version
        run: |
          VERSION=$(python3 scripts/version.py)
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match project version $VERSION."
            exit 1
          fi

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android graphics and user flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./android/gradlew -p android connectedDebugAndroidTest lintDebug

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name. Configure a persistent release key before releasing."
              exit 1
            fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nuitcomic-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          sh android/build.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/exported/nuitcomic.apk

      - name: Save Android test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuitComic-android-tests-${{ github.ref_name }}
          path: android/app/build/reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Save APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuitComic-apk-${{ github.ref_name }}
          path: build/exported/nuitcomic.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save Android obfuscation mapping
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuitComic-android-symbols-${{ github.ref_name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [ios, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: NuitComic-ipa-${{ github.ref_name }}
          path: release-assets

      - uses: actions/download-artifact@v8.0.1
        with:
          name: NuitComic-apk-${{ github.ref_name }}
          path: release-assets

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s release-assets/nuitcomic.ipa
          test -s release-assets/nuitcomic.apk
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if ! jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/nuitcomic.ipa release-assets/nuitcomic.apk --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/nuitcomic.ipa release-assets/nuitcomic.apk \
              --draft --verify-tag --generate-notes --title "NuitComic $RELEASE_TAG"
          fi
